# Global tool set for every myplace-managed machine.
# Managed by chezmoi from the myplace repo — edit there, not here.
# Source of truth: home/.chezmoitemplates/mise-config.toml (rendered to
# ~/.config/mise/config.toml on most machines and to
# ~/.config/mise/conf.d/myplace.toml on Omarchy, where config.toml is the
# distro's — ADR-0026).
#
# Note: Rust is installed via rustup and Node via fnm (see ADR-0007 and
# home/.chezmoiscripts/run_onchange_provision.sh), so neither is managed here.

[tools]
# CLI baseline — installed on every machine, servers included.
jq = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
fzf = "latest"
eza = "latest"
zoxide = "latest"
starship = "latest"
atuin = "latest"
gum = "latest"
glow = "latest"
pnpm = "latest"
gh = "latest"
delta = "latest"
# hunk: TUI diff viewer (`hunk diff`/`hunk show`) for reviewing working-tree and
# agent changesets; aqua ships prebuilt binaries. Themed via the managed
# ~/.config/hunk/config.toml.
hunk = "latest"
# jj (Jujutsu): Git-compatible VCS, adopt-per-repo. aqua backend ships prebuilt
# binaries (not the cargo:jj-cli fallback), so no rustup dependency (ADR-0021).
jj = "latest"
{{ if ne (dig "osRelease" "id" "" .chezmoi) "omarchy" -}}
# Omarchy packages herdr and ships a migration that uninstalls any mise herdr so
# it can't shadow /usr/bin/herdr with an older wire protocol — so there it stays
# the distro's (ADR-0026). The managed herdr config/plugins still apply.
herdr = "latest"
{{ end -}}
lazygit = "latest"
fastfetch = "latest"
d2 = "latest"
git-lfs = "latest"
miller = "latest"
yq = "latest"   # YAML/TOML/XML query+edit — the jq-shaped tool for the non-JSON configs
sd = "latest"   # find-and-replace; saner regex/replace than sed (sharkdp-adjacent)
fx = "latest"   # interactive JSON viewer — pairs with jq for exploring --json output
ast-grep = "latest"  # syntax-aware code search and structural rewrites
actionlint = "latest" # GitHub Actions workflow validation
hyperfine = "latest"  # command-line benchmarking
# tlrc: the official tldr-pages client (binary `tldr`). Chosen over tealdeer
# because tealdeer isn't in mise's registry (cargo-only, like tokei) whereas
# tlrc ships prebuilt binaries here. Its config lives at ~/.config/tlrc/.
tlrc = "latest"
# Note: tokei is NOT here. It stopped shipping prebuilt binaries after v12, so
# mise's only backend for it is `cargo:` (source build) — and mise must not drive
# cargo (Rust is rustup's, ADR-0007). It's installed via rustup's cargo in
# run_onchange_provision.sh instead.
# bun: JS/TS runtime used as a runner for some managed scripts (ADR-0014).
# This is bun, not Node — Node stays with fnm (ADR-0007).
bun = "latest"
# okq: query Markdown-with-frontmatter doc bundles (OKF/Obsidian vaults, this
# repo's docs/). Not in mise's registry — pulled straight from its GitHub
# releases, which cover darwin/linux × amd64/arm64.
"github:mikevalstar/okq" = "latest"
{{ if eq .chezmoi.os "linux" -}}
# btop's only mise backend (aqua) ships linux binaries only; macOS gets it via
# brew in run_onchange_provision.sh (ADR-0008).
btop = "latest"
{{ end -}}
{{ if ne .profile "server" -}}
# Interactive analytics database for desktop development and data inspection.
duckdb = "latest"
{{ end -}}

[settings]
experimental = false
