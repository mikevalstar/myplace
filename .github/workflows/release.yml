name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # go.mod is the single source of truth for the toolchain floor, and
          # check-latest forces a manifest lookup: without it setup-go happily
          # reuses a runner-cached older patch and GOTOOLCHAIN=local then fails
          # the build outright.
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
