name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          # go.mod is the single source of truth for the toolchain floor, and
          # check-latest forces a manifest lookup: without it setup-go happily
          # reuses a runner-cached older patch and GOTOOLCHAIN=local then fails
          # the build outright.
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
